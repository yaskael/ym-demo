<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
    <title>Onnenpyörä</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <h1>Onnenpyörä</h1>

        <div class="wheel-section">
            <div class="wheel-container">
                <div class="pointer"></div>
                <canvas id="wheel" width="400" height="400" role="img" aria-label="Onnenpyörä - pyöritä painamalla pyöritä-nappia"></canvas>
            </div>

            <div class="action-buttons">
                <button id="spin-btn" class="spin-button" aria-label="Pyöritä onnenpyörää">Pyöritä!</button>
                <button id="share-btn" class="share-button" aria-label="Kopioi jakamislinkki">Jaa linkki</button>
            </div>

            <div id="result" class="result" role="status" aria-live="polite" aria-atomic="true"></div>

            <div class="history-section" id="history-section" style="display: none;">
                <div class="history-header">
                    <h3>Historia</h3>
                    <button id="clear-history" class="clear-history-btn" aria-label="Tyhjennä historia">Tyhjennä</button>
                </div>
                <ul id="history-list" class="history-list"></ul>
            </div>
        </div>

        <div class="controls">
            <div class="controls-header">
                <h2>Vaihtoehdot</h2>
                <div class="sector-controls">
                    <button id="remove-sector" class="sector-btn" aria-label="Poista vaihtoehto" title="Poista">−</button>
                    <span id="sector-count" class="sector-count">8</span>
                    <button id="add-sector" class="sector-btn" aria-label="Lisää vaihtoehto" title="Lisää">+</button>
                </div>
            </div>
            <div class="inputs" id="inputs-container"></div>

            <div class="controls-footer">
                <div class="theme-selector">
                    <label for="theme-select">Teema:</label>
                    <select id="theme-select">
                    <option value="default">Klassinen</option>
                    <option value="pastel">Pastelli</option>
                    <option value="neon">Neon</option>
                    <option value="ocean">Meri</option>
                </select>
                </div>
                <label class="sound-toggle">
                    <input type="checkbox" id="sound-toggle" checked>
                    <span>Äänet</span>
                </label>
            </div>
        </div>
    </main>

    <div id="confetti-container" class="confetti-container" aria-hidden="true"></div>

    <script src="js/storage.js"></script>
    <script src="js/wheel.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
