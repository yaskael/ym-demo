<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onnenpyörä</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <h1>Onnenpyörä</h1>

        <div class="wheel-section">
            <div class="wheel-container">
                <div class="pointer"></div>
                <canvas id="wheel" width="400" height="400"></canvas>
            </div>

            <button id="spin-btn" class="spin-button">Pyöritä!</button>

            <div id="result" class="result"></div>
        </div>

        <div class="controls">
            <h2>Vaihtoehdot</h2>
            <div class="inputs">
                <div class="input-group">
                    <label for="sector-1">1.</label>
                    <input type="text" id="sector-1" maxlength="20" placeholder="Vaihtoehto 1">
                </div>
                <div class="input-group">
                    <label for="sector-2">2.</label>
                    <input type="text" id="sector-2" maxlength="20" placeholder="Vaihtoehto 2">
                </div>
                <div class="input-group">
                    <label for="sector-3">3.</label>
                    <input type="text" id="sector-3" maxlength="20" placeholder="Vaihtoehto 3">
                </div>
                <div class="input-group">
                    <label for="sector-4">4.</label>
                    <input type="text" id="sector-4" maxlength="20" placeholder="Vaihtoehto 4">
                </div>
                <div class="input-group">
                    <label for="sector-5">5.</label>
                    <input type="text" id="sector-5" maxlength="20" placeholder="Vaihtoehto 5">
                </div>
                <div class="input-group">
                    <label for="sector-6">6.</label>
                    <input type="text" id="sector-6" maxlength="20" placeholder="Vaihtoehto 6">
                </div>
                <div class="input-group">
                    <label for="sector-7">7.</label>
                    <input type="text" id="sector-7" maxlength="20" placeholder="Vaihtoehto 7">
                </div>
                <div class="input-group">
                    <label for="sector-8">8.</label>
                    <input type="text" id="sector-8" maxlength="20" placeholder="Vaihtoehto 8">
                </div>
            </div>
        </div>
    </main>

    <script src="js/storage.js"></script>
    <script src="js/wheel.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
